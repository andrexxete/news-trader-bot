name: News Trader Bot

on:
  schedule:
    # Resumen diario a las 07:00 AM Colombia, lunes a viernes.
    - cron: '0 12 * * 1-5'
    # Busca noticias próximas durante la sesión de EE. UU. (hora de Colombia).
    - cron: '*/15 11-20 * * 1-5'
  
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecución'
        required: true
        default: 'resumen'
        type: choice
        options:
          - resumen
          - alerta

concurrency:
  group: news-trader-${{ github.event.schedule || github.event.inputs.modo || 'manual' }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv
    
    - name: Create .env file
      run: |
        echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" > .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

    - name: Restore alert and projection history
      if: ${{ (github.event_name == 'schedule' && github.event.schedule == '*/15 11-20 * * 1-5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'alerta') }}
      uses: actions/cache@v4
      with:
        path: |
          alert_state.json
          forecast_history.jsonl
        key: news-trader-state-${{ github.run_id }}
        restore-keys: |
          news-trader-state-
    
    - name: Send daily summary
      if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1-5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'resumen') }}
      run: python main.py resumen

    - name: Send pre-release alerts
      if: ${{ (github.event_name == 'schedule' && github.event.schedule == '*/15 11-20 * * 1-5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'alerta') }}
      run: python main.py alerta
